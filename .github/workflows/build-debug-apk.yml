name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare canonical BersolekMart branding
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare_branding.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform
        run: flutter create . --platforms=android

      - name: Apply Android permissions and branded app label
        run: python scripts/patch_android.py

      - name: Remove generated placeholder test
        run: |
          rm -f test/widget_test.dart
          if [ -d test ] && [ -z "$(ls -A test)" ]; then rmdir test; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate branded Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bersolekmart-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
